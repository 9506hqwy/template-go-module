name: CI

on:
  push:
    branches: [ main ]
    tags-ignore: [ '**' ]
    paths-ignore:
      - '.devcontainer/**'
      - '.github/**'
      - '.vscode/**'
      - '.envrc'
      - '.gitignore'
      - '.lefthook.yml'
      - 'devbox.json'
      - 'LICENSE'
      - 'README.md'
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    uses: 9506hqwy/actions/.github/workflows/go-ci-ubuntu.yml@main

  windows:
    uses: 9506hqwy/actions/.github/workflows/go-ci-windows.yml@main
